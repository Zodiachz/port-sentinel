# port-sentinel allowlist for a typical small web server.
# One line per rule:  PROTO  PORTS  [PROGRAM]  [OPTIONS]
#   PROTO    tcp, udp or any
#   PORTS    22 | 80,443 | 8000-8099 | *
#   PROGRAM  glob on the program name (sshd, redis*, python3); * or nothing = any program
#   OPTIONS  public (default) | private | loopback   how far the bind address may reach
#            required                                alert when nothing listens there
#            cmd=GLOB                                glob on the full command line (no spaces: use ?)

# the front door
tcp  22       sshd      required
tcp  80,443   nginx     required

# app servers stay behind nginx
tcp  3000     node      loopback  cmd=*/srv/api/server.js*
tcp  8000     gunicorn  loopback

# databases never leave the machine
tcp  5432     postgres      loopback  required
tcp  6379     redis-server  loopback

# a metrics exporter reachable from the private network only
tcp  9100     node_exporter  private

# system services
udp  53       systemd-resolved  loopback
tcp  53       systemd-resolved  loopback
udp  68       systemd-networkd
udp  323      chronyd           loopback
